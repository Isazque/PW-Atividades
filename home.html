<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon"
      href="{{ url_for('static', filename='favicon.ico') }}?v=2">

    <title>Home - Calculadora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 17px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;

            padding: 12px 30px;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora</h1>

        <p>
            Bem-vindo à nossa calculadora!
        </p>

        <a href="/operacao">
            <button>Começar</button>
        </a>

    </div>

</body>

</html>
