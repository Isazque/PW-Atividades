<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Operação - Calculadora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Realizar Operação</h1>

        <form method="POST" onsubmit="return confirmarOperacao()">

            <label>Primeiro número:</label>

            <input
                type="number"
                id="numero1"
                name="numero1"
                step="any"
                required
            >

            <label>Operação:</label>

            <select name="operador" required>
                <option value="+">Somar (+)</option>
                <option value="-">Subtrair (-)</option>
                <option value="*">Multiplicar (×)</option>
                <option value="/">Dividir (÷)</option>
            </select>

            <label>Segundo número:</label>

            <input
                type="number"
                id="numero2"
                name="numero2"
                step="any"
                required
            >

            <button type="submit">
                Ver resultado
            </button>

        </form>

        <a href="/" class="voltar">
            Voltar para Home
        </a>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
